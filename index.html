<body>

<button class="btn btn-dark" onclick="exportCSV()">تصدير Excel</button>
<button class="btn btn-red" onclick="clearAll()">مسح الكل</button>
<button class="btn btn-dark" onclick="downloadSelf()">⬇️ تحميل الملف مستقل</button>
</div>
</header>
<div class="wrap">
<div class="card">
<div class="table-wrap">
<table id="tbl">
<thead>
<tr>
<th>ت</th>
<th>اسم الاستاذ</th>
<th>تاريخ الالتحاق<br><span class="date-lbl">سنة - شهر - يوم</span></th>
<th>تاريخ النزول<br><span class="date-lbl">سنة - شهر - يوم</span></th>

<tbody id="tbody"></tbody>

</div>
</div>
</div>
<script>
const KEY='dawrat_jaysh_final_v3';
let rows = JSON.parse(localStorage.getItem(KEY) || 'null');
if(!rows){rows = Array.from({length:16},(_,i)=>({id:Date.now()+i,name:'',join:'',leave:'',place:'',course:'',type:'',note:''}))}
function save(){localStorage.setItem(KEY, JSON.stringify(rows))}
function render(){
const tb=document.getElementById('tbody');tb.innerHTML='';
rows.forEach((r,idx)=>{
const tr=document.createElement('tr');
tr.innerHTML=`
<td><span class="badge">${idx+1}</span></td>
<td><input type="text" value="${r.name}" placeholder="الاسم" oninput="rows[${idx}].name=this.value;save()"></td>
<td><input type="date" dir="ltr" lang="en" value="${r.join}" style="direction:ltr" onchange="rows[${idx}].join=this.value;save()"></td>
<td><input type="date" dir="ltr" lang="en" value="${r.leave}" style="direction:ltr" onchange="rows[${idx}].leave=this.value;save()"></td>
<td><input type="text" value="${r.place}" placeholder="اكتب المكان" oninput="rows[${idx}].place=this.value;save()"></td>
<td><input type="text" value="${r.course}" placeholder="اسم الدورة" oninput="rows[${idx}].course=this.value;save()"></td>
<td><input type="text" value="${r.type}" placeholder="نوع الدورة" oninput="rows[${idx}].type=this.value;save()"></td>
<td><input type="text" value="${r.note}" placeholder="ملاحظات" oninput="rows[${idx}].note=this.value;save()"></td>

}
function addRow(){rows.push({id:Date.now(),name:'',join:'',leave:'',place:'',course:'',type:'',note:''});save();render()}
function del(i){if(confirm('تحذف هذا الصف؟')){rows.splice(i,1);save();render()}}
function clearAll(){if(confirm('تمسح كل البيانات؟')){rows=Array.from({length:16},(_,i)=>({id:Date.now()+i,name:'',join:'',leave:'',place:'',course:'',type:'',note:''}));save();render()}}
function exportCSV(){
let csv='ت,اسم الاستاذ,تاريخ الالتحاق,تاريخ النزول,مكان الالتحاق,اسم الدورة,نوع الدورة,ملاحظات\n';
rows.forEach((r,i)=>{csv+=${i+1},"${r.name}","${r.join}","${r.leave}","${r.place}","${r.course}","${r.type}","${r.note}"\n`});
const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='سجل-الدورات-الجيش.csv';a.click()
}
function downloadSelf(){
const content=document.documentElement.outerHTML;
const blob=new Blob([content],{type:'text/html;charset=utf-8;'});
const url=URL.createObjectURL(blob);
const a=document.createElement('a');a.href=url;a.download='index.html';a.click();
}
render();
</script>
