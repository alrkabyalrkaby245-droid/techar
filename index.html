<body>
<header>
<h1>تيكار - سجل حضور وغياب الأساتذة</h1>
<div style="display:flex;gap:8px;align-items:center">
<input type="date" id="date" style="padding:8px 12px;border-radius:8px;border:none">
<button class="btn green" onclick="exportCSV()">تصدير Excel</button>
</div>
</header>
<div class="stats">
<div class="stat"><div class="n" id="present" style="color:#22c55e">0</div><div style="font-size:12px;color:#64748b">حاضر اليوم</div></div>
<div class="stat"><div class="n" id="absent" style="color:#ef4444">0</div><div style="font-size:12px;color:#64748b">غائب اليوم</div></div>
<div class="stat"><div class="n" id="leave" style="color:#f59e0b">0</div><div style="font-size:12px;color:#64748b">مجاز</div></div>
<div class="stat"><div class="n" id="total">0</div><div style="font-size:12px;color:#64748b">مجموع الأساتذة</div></div>
</div>
<div class="controls">
<input id="newName" placeholder="اسم الاستاذ الجديد" style="flex:1;min-width:160px">
<input id="newSub" placeholder="المادة" style="width:130px">
<button class="btn primary" onclick="addTeacher()">إضافة استاذ</button>
<input id="search" placeholder="بحث..." style="width:130px" oninput="render()">
</div>
<div class="list" id="list">
<div class="row head"><div>الاستاذ / المادة</div><div>الحالة اليوم</div><div>تسجيل الحضور</div><div></div></div>
</div>
<div style="max-width:1100px;margin:14px auto;padding:12px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;font-size:12px;color:#1e40af;text-align:center">يحفظ تلقائيا - يشتغل بدون انترنت - مجاني 100%</div>
<script>
let teachers=JSON.parse(localStorage.getItem('techar_teachers_final')||'[{"id":"1","name":"احمد الركابي","sub":"رياضيات"},{"id":"2","name":"محمد علي","sub":"فيزياء"},{"id":"3","name":"فاطمة حسن","sub":"كيمياء"}]');
let records=JSON.parse(localStorage.getItem('techar_records_final')||'[]');
let dateInput=document.getElementById('date');dateInput.valueAsDate=new Date();dateInput.onchange=render;
[22/09/2026 10:18 م] يا حسين: function save(){localStorage.setItem('techar_teachers_final',JSON.stringify(teachers));localStorage.setItem('techar_records_final',JSON.stringify(records))}
function getStatus(id){let d=dateInput.value;let r=records.find(x=>x.id==id&&x.date==d);return r?r.status:''}
function setStatus(id,status){let d=dateInput.value;records=records.filter(x=>!(x.id==id&&x.date==d));records.push({id,date:d,status,time:new Date().toLocaleTimeString('ar-IQ',{hour:'2-digit',minute:'2-digit'})});save();render();}
function addTeacher(){let name=document.getElementById('newName').value.trim();let sub=document.getElementById('newSub').value.trim()||'عام';if(!name)return;teachers.push({id:Date.now().toString(),name,sub});document.getElementById('newName').value='';document.getElementById('newSub').value='';save();render();}
function delTeacher(id){if(!confirm('تحذف الاستاذ؟'))return;teachers=teachers.filter(t=>t.id!=id);records=records.filter(r=>r.id!=id);save();render();}
function render(){let d=dateInput.value;let search=document.getElementById('search').value;let filtered=teachers.filter(t=>t.name.includes(search)||t.sub.includes(search));let today=records.filter(r=>r.date==d);document.getElementById('present').innerText=today.filter(r=>r.status=='حاضر').length;document.getElementById('absent').innerText=today.filter(r=>r.status=='غائب').length;document.getElementById('leave').innerText=today.filter(r=>r.status=='مجاز').length;document.getElementById('total').innerText=teachers.length;let list=document.getElementById('list');list.innerHTML='<div class="row head"><div>الاستاذ / المادة</div><div>الحالة اليوم</div><div>تسجيل الحضور</div><div></div></div>';filtered.forEach(t=>{let st=getStatus(t.id);let color=st=='حاضر'?'#dcfce7':st=='غائب'?'#fee2e2':st=='مجاز'?'#fef3c7':st=='متأخر'?'#e0e7ff':'#f1f5f9';let tcolor=st=='حاضر'?'#166534':st=='غائب'?'#991b1b':st=='مجاز'?'#92400e':st=='متأخر'?'#3730a3':'#64748b';let div=document.createElement('div');div.className='row';div.innerHTML=<div><div style="font-weight:700">${t.name}</div><div style="font-size:11px;color:#64748b">${t.sub}</div></div><div>${st?<span class="badge" style="background:${color};color:${tcolor}">${st}</span>:<span style="color:#94a3b8;font-size:11px">لم يسجل</span>}</div><div><button class="btn ${st=='حاضر'?'active':''}" onclick="setStatus('${t.id}','حاضر')">حاضر</button><button class="btn ${st=='غائب'?'active':''}" onclick="setStatus('${t.id}','غائب')">غائب</button><button class="btn ${st=='مجاز'?'active':''}" onclick="setStatus('${t.id}','مجاز')">مجاز</button><button class="btn ${st=='متأخر'?'active':''}" onclick="setStatus('${t.id}','متأخر')">متأخر</button></div><div><button onclick="delTeacher('${t.id}')" style="background:none;border:none;color:#ef4444;cursor:pointer">✕</button></div>;list.appendChild(div);});}
function exportCSV(){let bom='\uFEFF';let csv=bom+'التاريخ,الاسم,المادة,الحالة,الوقت\n';records.forEach(r=>{let t=teachers.find(x=>x.id==r.id);csv+=${r.date},${t?.name||''},${t?.sub||''},${r.status},${r.time}\n;});let blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=سجل-الحضور-${dateInput.value}.csv;a.click();}
render();
</script>
